# AegisAI Local PoC Deployment
# Run: docker compose up -d
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  slm-redactor:
    build:
      context: ../slm-redactor
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    environment:
      PORT: "8443"
      UPSTREAM_URL: "https://api.openai.com"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgres://aegis:aegis_local_dev@postgres:5432/aegis?sslmode=disable"
      SLM_REDACTOR_URL: "http://slm-redactor:8000"
      MAX_TOKENS_PER_MIN: "100000"
      MAX_COST_PER_DAY: "10000"
      API_KEY: "sk-aegis-local-dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      slm-redactor:
        condition: service_started

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile.prod
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "http://gateway:8443"
    depends_on:
      - gateway

volumes:
  pgdata: