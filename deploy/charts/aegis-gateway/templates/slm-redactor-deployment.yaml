{{- if .Values.slmRedactor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-slm-redactor
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: slm-redactor
spec:
  replicas: {{ .Values.slmRedactor.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: slm-redactor
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: slm-redactor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: slm-redactor
          image: "{{ .Values.slmRedactor.image.repository }}:{{ .Values.slmRedactor.image.tag }}"
          imagePullPolicy: {{ .Values.slmRedactor.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.slmRedactor.port }}
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.slmRedactor.port | quote }}
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            {{- toYaml .Values.slmRedactor.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.slmRedactor.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.slmRedactor.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-slm-redactor
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: slm-redactor
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.slmRedactor.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: slm-redactor
{{- end }}