apiVersion: v2
name: aegis-gateway
description: AegisAI — Enterprise Agentic AI Governance Gateway
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.24.0"

dependencies:
  - name: redis
    version: "~18.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "~13.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled